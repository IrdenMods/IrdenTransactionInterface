name: Generate Archive and Create Release
on:
  push:
    branches:
      - master
    paths:
      - '_metadata'
      - 'CHANGELOG.md'

env:
  MOD_NAME: "IrdenTransactionInterface"


jobs:
  build:
    uses: IrdenMods/WorkflowRepo/.github/workflows/publish.yml@master
    secrets: inherit
    with:
      release: true
      upload_to_gd: true
      notify_discord: true
